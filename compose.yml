# Local development stack. Brings up everything the services talk to; the services and
# the frontend you run yourself from your IDE and `pnpm dev`.
#
#   docker compose up -d
#
# This is a single-node Kafka, not the 3-node KRaft quorum from the proposal. That is
# deliberate: the Raft behaviour is a production and demo concern, and 3 brokers on a
# laptop buys nothing. deploy/infra/kafka has the real 3-node setup.
#
# Both Postgres and Mongo are here because the per-service split is not decided yet.
# Once it is, drop whichever a service does not use.

name: cgeek

services:
  kafka:
    image: apache/kafka:4.1.0
    container_name: cgeek-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      # Single node, so a replication factor of 3 is impossible here.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cgeek-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mongo:
    image: mongo:8
    container_name: cgeek-mongo
    ports:
      - "27017:27017"
    # Atlas Free is a replica set, so run one here too: transactions and change streams
    # behave differently on a standalone mongod and you want to find that out locally.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db

  postgres:
    image: postgres:17-alpine
    container_name: cgeek-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cgeek
      POSTGRES_PASSWORD: cgeek
      POSTGRES_DB: cgeek
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cgeek"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mongo-data:
  postgres-data:
