spring:
  application:
    name: gateway

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

  security:
    oauth2:
      resourceserver:
        jwt:
          # Auth service publishes the RS256 public key here; the gateway verifies every
          # request once so downstream services trust the X-User-Id header.
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth
              uri: ${AUTH_URI:http://localhost:8081}
              predicates: [ "Path=/api/auth/**" ]
            - id: problem
              uri: ${PROBLEM_URI:http://localhost:8082}
              predicates: [ "Path=/api/problems/**" ]
            - id: submission
              uri: ${SUBMISSION_URI:http://localhost:8083}
              predicates: [ "Path=/api/submissions/**,/ws/submissions/**" ]
            - id: knowledge
              uri: ${KNOWLEDGE_URI:http://localhost:8084}
              predicates: [ "Path=/api/knowledge/**" ]
            - id: ranking
              uri: ${RANKING_URI:http://localhost:8085}
              predicates: [ "Path=/api/rank/**,/api/leaderboard/**" ]

server:
  port: ${PORT:8080}

# TODO: CORS locked to the frontend origin, and the Redis rate limiter (10 submissions
# per minute per user) are configured here once the filter chain exists.

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
