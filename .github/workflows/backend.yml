name: backend

on:
  push:
    branches: [ main ]
    paths: [ 'pom.xml', 'shared/**', 'gateway/**', 'services/**', 'judge/**', '.github/workflows/backend.yml' ]
  pull_request:
    paths: [ 'pom.xml', 'shared/**', 'gateway/**', 'services/**', 'judge/**', '.github/workflows/backend.yml' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      # Builds every module including shared, so a DTO change that breaks the judge
      # fails here rather than in production.
      - run: mvn -B verify
