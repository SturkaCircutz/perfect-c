spring:
  application:
    name: problem

  # TODO: persistence - store for the problems collection/table is undecided.

# Test case bodies live in object storage, not the database.
testcases:
  storage-url: ${TESTCASE_STORAGE_URL:}

server:
  port: ${PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
