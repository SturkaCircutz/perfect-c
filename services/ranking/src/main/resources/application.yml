spring:
  application:
    name: ranking

  # TODO: persistence - store for XP and levels is undecided.

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: ${KAFKA_GROUP:ranking}
      auto-offset-reset: earliest
      enable-auto-commit: false

server:
  port: ${PORT:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

# Topic names, shared by every Kafka client. Partition counts and keys are declared in
# deploy/infra/kafka, not here.
cgeek:
  topics:
    submissions: submissions
    snippet-runs: snippet_runs
    results: results
    submissions-dlq: submissions.DLQ
